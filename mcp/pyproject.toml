[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-mcp"
version = "0.9.1"
description = "MCP server that lets an AI coding agent drive Liminal Editor inside Blender through the Liminal Bridge add-on."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]
keywords = ["liminal", "blender", "mcp", "level-design"]

[project.urls]
Homepage = "https://liminal.lv"

[project.scripts]
liminal-mcp = "liminal_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
